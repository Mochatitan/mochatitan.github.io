name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"] # Change to "master" if your default branch is master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build # Makes sure Vite/React builds your project
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist' # If using Next.js/Nuxt, change this to './out' or your build folder
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
