<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" href="./styles.css">
    <script src="./scripts/fizzbuzzscript4.js" defer></script>
    <script src="https://lint.page/kit/880bd5.js" crossorigin="anonymous"></script>
    <title>LUKES RUSTY SPOTTED CAT - WEB115 - FIZZBUZZ</title>
</head>

<body>
    <div data-include="components/header.html"></div>

    <div data-include="components/navbar.html"></div>

    <main>
        <h2>Fizzbuzz 1</h2>
        <h3 id='greeting'>Welcome to Anytutor!</h3>
        <form class="input-form">
            <fieldset>
                <legend>Personal Info</legend>
                <input type="text" id="first_name" placeholder="Enter your first name">
                <input type="text" id="middle_initial" placeholder="M" maxlength="1">
                <input type="text" id="last_name" placeholder="Enter your last name">
            </fieldset>
            <fieldset>
                <legend>Number customization</legend>
                <p> The output will count out how many numbers you tell it to, you can add special labels to numbers
                    depending on if they are a multiple of a number, and a default if they are not any of the labels.
                </p>
                <label for="number_count">Numbers to count:</label>
                <input type="number" id="number_count" placeholder="Ex: 140" value="50">
                <label for="number_count">(50 by default)</label>
                <br>
                <br>
                <label for="default_label">Default label:</label>
                <input type="text" id="default_label" placeholder="Ex: Hello!">
                <label for="default_label">(Empty by default)</label>
                <br>
                <p>Labels: </p>

                <div style="margin-left:20px" id="labelList">

                    <!-- <input type="number" id="label1" placeholder="num to label">
                    <input type="number" id="label1" placeholder="label for num's multiples">
                    <button type="button" id="remove-label">Remove Label</button> -->
                </div>

                <button type="button" id="add-label">Add Label</button>

            </fieldset>
            <button type="submit">Submit</button>
        </form>

        <div id="outputLoop">
            <h3>Output Loop</h3>
        </div>
    </main>


    <div data-include="components/footer.html"></div>

    <script src="scripts/HTMLInclude.js" defer></script>
</body>

</html>
